name: Spec Kit 4884 Phase 2 Windows parity
on:
  push:
    branches: [codex/ci-spec-kit-4884-windows]
permissions:
  contents: read
jobs:
  legacy-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5106658c785c710514de1cfd670ab68c9dff1761
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          $PSVersionTable.PSVersion.ToString()
      - name: Use Git for Windows Bash
        shell: powershell
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) { throw 'Git for Windows Bash is required' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: uv sync --extra test
      - run: uv run pytest -vv -rs tests/integration/test_first_party_script_variants.py tests/extensions/git/test_git_extension.py tests/extensions/git/test_git_extension_python_parity.py
