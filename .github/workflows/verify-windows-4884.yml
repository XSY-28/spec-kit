name: Spec Kit 4884 Windows verification
on:
  push:
    branches: [codex/ci-spec-kit-4884-windows]
permissions:
  contents: read
jobs:
  legacy-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 240a6671c1966927106e940ada9d0500ffc5f915
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          $PSVersionTable.PSVersion.ToString()
      - run: uv sync --extra test
      - run: uv run pytest -vv -rs tests/test_preset_template_execution_host.py tests/test_check_prerequisites_python_parity.py tests/test_resolve_template_python_parity.py
