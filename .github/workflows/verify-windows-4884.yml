name: Spec Kit 5531 review fixes on native Windows
on:
  push:
    branches: [codex/ci-spec-kit-4884-windows]
permissions:
  contents: read
jobs:
  legacy-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 669562586119d72051e40c0ec5d756643318ca9f
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Confirm Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          $PSVersionTable.PSVersion.ToString()
      - name: Use Git for Windows Bash
        shell: powershell
        run: |
          $gitBin = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) { throw 'Git for Windows Bash is required' }
          $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: uv sync --extra test
      - run: uv run pytest -vv -rs tests/test_preset_template_execution_host.py tests/test_check_prerequisites_python_parity.py tests/test_resolve_template_python_parity.py tests/specify_cli/presets/test_registry.py tests/test_setup_tasks.py
